<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QX</title>
<meta name="description" content="QX: lista swing, posiciones, resultados y noticias">
<meta name="theme-color" content="#0a0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="QX">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Misma identidad que la Terminal QX: tema oscuro, cifras en monoespaciada, títulos condensados en ámbar, tablas compactas. */
:root{
  --ink:#0a0f1a; --panel:#0f1726; --panel-2:#142036; --rule:#22314d; --rule-soft:#1a2740;
  --fg:#d7e1f0; --muted:#7d8fab; --dim:#566683;
  --amber:#f0b44c; --up:#33cf96; --down:#ff6f6f; --model:#6cc4ff;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ink);color:var(--fg)}
body{font-family:var(--mono);font-size:12.5px;line-height:1.45;font-variant-numeric:tabular-nums;
  padding:calc(var(--safe-t) + 6px) 12px calc(var(--safe-b) + 76px);min-height:100vh}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0 8px;border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:baseline;gap:8px}
.brand b{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.04em;color:var(--amber)}
.brand span{font-family:var(--display);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border:1px solid var(--rule);border-radius:3px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--dim);display:inline-block}
.pill.on i{background:var(--up);box-shadow:0 0 8px var(--up)}
.pill.off i{background:var(--down)}
.strip{display:flex;gap:6px 16px;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid var(--rule);color:var(--muted);font-size:11.5px}
.strip b{color:var(--amber);font-weight:600;margin-right:6px}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--rule-soft);border:1px solid var(--rule-soft);margin-top:10px}
.kpi{background:var(--panel);padding:8px 8px 7px}
.kpi .k{font-family:var(--display);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v{font-size:15px;font-weight:600;margin-top:1px;white-space:nowrap}
@media (max-width:360px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

.p{background:var(--panel);border:1px solid var(--rule-soft);margin-top:10px;min-width:0}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:8px 10px;border-bottom:1px solid var(--rule-soft);background:var(--panel-2)}
.ph h2{margin:0;font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);white-space:nowrap}
.ph small{color:var(--muted);font-size:10.5px;text-align:right}
.pb{padding:4px 10px 8px;min-width:0}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse}
th{font-weight:500;color:var(--dim);font-size:10px;letter-spacing:.08em;text-transform:uppercase;text-align:right;padding:6px 5px 4px;border-bottom:1px solid var(--rule-soft);white-space:nowrap}
td{text-align:right;padding:6px 5px;border-bottom:1px solid var(--rule-soft);white-space:nowrap;vertical-align:top}
tr:last-child td{border-bottom:0}
th:first-child,td:first-child,th.l,td.l{text-align:left}
td.wrap{white-space:normal;font-size:11.5px;line-height:1.35;color:var(--muted)}
tr.grp td{background:var(--panel-2);color:var(--muted);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:5px}
tr.off td{opacity:.55}
.sym{color:var(--amber);font-weight:600}
.sub2{display:block;color:var(--dim);font-size:10.5px;font-weight:400;max-width:140px;overflow:hidden;text-overflow:ellipsis}
.rank{color:var(--dim);width:18px}
.up{color:var(--up)}.down{color:var(--down)}.mdl{color:var(--model)}.mut{color:var(--muted)}.amb{color:var(--amber)}
.chip{font-size:10px;padding:0 4px;border:1px solid var(--rule);border-radius:2px;color:var(--muted);margin-left:4px;white-space:nowrap}
.chip.pos{border-color:#215f4c;color:var(--up)}.chip.neg{border-color:#6b3238;color:var(--down)}
.note{color:var(--muted);font-size:11px;margin:8px 0 0;line-height:1.45}
.empty{color:var(--muted);padding:12px 0;white-space:normal;text-align:left}
.list div{padding:6px 0;border-bottom:1px solid var(--rule-soft);font-size:12px;white-space:normal}
.list div:last-child{border-bottom:0}
.thb{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 42px;gap:8px;align-items:center;padding:4px 0;font-size:11.5px}
.bar{position:relative;height:6px;background:var(--rule-soft)}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--amber)}
.bar i.cool{background:var(--dim)}

nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(10,15,26,.96);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--rule);padding:4px 4px calc(var(--safe-b) + 4px)}
nav button{background:none;border:0;border-top:2px solid transparent;padding:7px 0 5px;font:600 13px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:20px;height:20px}
nav button[aria-selected="true"]{color:var(--amber);border-top-color:var(--amber)}
section[hidden]{display:none}
.acts{display:flex;gap:8px;justify-content:center;margin-top:12px}
.btn{border:1px solid var(--rule);background:var(--panel-2);border-radius:3px;padding:8px 14px;font:600 13px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--fg)}
.btn.pri{background:var(--amber);border-color:var(--amber);color:#111}

.login{max-width:400px;margin:14vh auto 0}
.login .p{margin-top:14px}
.login label{display:block;font-family:var(--display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.login input{width:100%;font-family:var(--mono);color:var(--fg);background:var(--ink);border:1px solid var(--rule);border-radius:3px;padding:10px;margin-top:4px}
.err{color:var(--down);font-size:12px;min-height:18px;margin:8px 0}
</style>
</head>
<body>
<div id="auth" class="login" hidden>
  <div class="brand"><b>QX</b><span>Terminal cuantitativa</span></div>
  <div class="p">
    <div class="ph"><h2>Acceso</h2><small>solo cuentas autorizadas</small></div>
    <div class="pb">
      <label for="em">Correo</label>
      <input id="em" type="email" autocomplete="username" inputmode="email" autocapitalize="off">
      <label for="pw">Contraseña</label>
      <input id="pw" type="password" autocomplete="current-password">
      <div class="err" id="aerr"></div>
      <div style="display:flex;gap:8px">
        <button class="btn pri" id="bIn" style="flex:1">Entrar</button>
        <button class="btn" id="bUp" style="flex:1">Crear cuenta</button>
      </div>
      <p class="note">La primera vez toca «Crear cuenta», confirma el correo que te llega y regresa a entrar.</p>
    </div>
  </div>
</div>

<div id="app" hidden>
  <div class="top">
    <div class="brand"><b>QX</b><span>Swing 5 días</span></div>
    <span class="pill" id="pill"><i></i><span>—</span></span>
  </div>
  <div class="strip" id="strip"></div>
  <div class="kpis" id="kpis"></div>
  <section id="t-hoy"></section>
  <section id="t-pos" hidden></section>
  <section id="t-res" hidden></section>
  <section id="t-news" hidden></section>
  <div class="acts">
    <button class="btn" id="bRef">Actualizar</button>
    <button class="btn" id="bOut">Salir</button>
  </div>
</div>

<nav id="nav" hidden role="tablist">
  <button data-t="hoy" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"/></svg>Hoy</button>
  <button data-t="pos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M8 6V4h8v2"/></svg>Posiciones</button>
  <button data-t="res"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Resultados</button>
  <button data-t="news"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h10M7 16h6"/></svg>Noticias</button>
</nav>

<script src="vendor/supabase.js"></script>
<script>
const SB_URL = "https://jswqsaogomxyjtyhoucn.supabase.co";
const SB_KEY = "sb_publishable_xx5KN3nM6KwkNn6Af_LBDw_2BtJ8XEn";   // llave pública: los datos sólo salen con una sesión autorizada
const CAPITAL = 10000, PER = CAPITAL / 5 / 10;
const sb = supabase.createClient(SB_URL, SB_KEY, {auth:{persistSession:true, autoRefreshToken:true}});
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = (x, d=2) => x==null || !isFinite(x) ? "—" : (x>=0?"+":"") + (x*100).toFixed(d) + "%";
const cls = (x) => x==null || !isFinite(x) ? "mut" : x>0 ? "up" : x<0 ? "down" : "mut";
const px = (x) => x==null || !isFinite(x) ? "—" : x.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const money = (x) => x==null || !isFinite(x) ? "—" : "$" + px(x);
const day = (d) => d ? new Date(d+"T12:00:00Z").toLocaleDateString("es-MX",{weekday:"short",day:"numeric",month:"short",timeZone:"UTC"}) : "—";
const dd = (d) => d ? new Date(d+"T12:00:00Z").toLocaleDateString("es-MX",{day:"2-digit",month:"short",timeZone:"UTC"}) : "—";
const qty = (sh, p) => sh > 0 ? String(sh) : p ? (PER/p).toFixed(3) : "—";
const panel = (title, small, body) => `<div class="p"><div class="ph"><h2>${title}</h2><small>${small||""}</small></div><div class="pb">${body}</div></div>`;
let D = null, Q = {}, QAT = null, QERR = "", qTimer = null;

const ny = () => new Date(new Date().toLocaleString("en-US",{timeZone:"America/New_York"}));
function marketOpen(){ const t = ny(), m = t.getHours()*60 + t.getMinutes(), w = t.getDay(); return w>0 && w<6 && m >= 9*60+30 && m < 16*60; }
const live = () => QAT && marketOpen();
async function quotes(){
  if (!D || $("app").hidden || document.hidden || !marketOpen()) return;
  const syms = [...new Set([...(((D.swing||{}).picks)||[]).map(p=>p.symbol), ...(D.open||[]).map(p=>p.symbol), "SPY", "QQQ", "IWM"])];
  const {data, error} = await sb.functions.invoke("quotes", {body:{symbols:syms}});
  if (error){
    let code = ""; try{ code = (await error.context.json()).error; }catch(e){}
    QERR = code==="faltan_llaves" ? "Faltan las llaves de Alpaca en Supabase" : "Precios en vivo sin conexión";
  } else { Q = data.quotes || {}; QAT = new Date(); QERR = ""; }
  render();
}
function liveLoop(){ clearInterval(qTimer); quotes(); qTimer = setInterval(quotes, 15000); }

function show(which){ $("auth").hidden = which!=="auth"; $("app").hidden = which!=="app"; $("nav").hidden = which!=="app"; }
function tab(t){
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected", b.dataset.t===t));
  ["hoy","pos","res","news"].forEach(k=>$("t-"+k).hidden = k!==t);
  try{ localStorage.setItem("qx_tab", t); }catch(e){}
  scrollTo(0,0);
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>tab(b.dataset.t));

async function load(){
  const {data, error} = await sb.rpc("qx_app");
  if (error){
    if (/no autorizado/.test(error.message)){ await sb.auth.signOut(); show("auth"); $("aerr").textContent = "Tu cuenta ya existe, pero todavía no tiene acceso. Pídele a Javier que te autorice y vuelve a entrar."; return; }
    QERR = "Sin conexión con la base de datos"; if (D) render(); else $("t-hoy").innerHTML = panel("Sin conexión", "", `<p class="empty">No pude leer los datos (${esc(error.message)}). Toca Actualizar.</p>`); return;
  }
  D = data; render();
  try{ localStorage.setItem("qx_cache", JSON.stringify(D)); }catch(e){}
}

/* ---------- cálculos ---------- */
const nowPx = (p) => { const q = Q[p.symbol]; return q && q.last && live() ? q.last : p.last_c; };
const bought = (p) => p.entry && p.entry <= p.max_entry * 1.0000001;
const ret = (p) => { const x = nowPx(p); return bought(p) && x && p.last_d >= p.entry_d ? x/p.entry - 1 : null; };
const mean = (xs) => xs.length ? xs.reduce((a,b)=>a+b,0)/xs.length : null;
function nextSell(){ const last = (D.spy_last||{}).d || ""; return (D.open||[]).map(p=>p.sell_session).sort().find(d => d > last) || ""; }
function cum(rows, k1, k2){ let a=1, b=1, w=0; rows.forEach(x=>{ a*=1+(x[k1]||0); b*=1+(x[k2]||0); if((x[k1]||0)>(x[k2]||0)) w++; }); return {m:a-1, s:b-1, w, n:rows.length}; }

/* ---------- vistas ---------- */
function render(){ renderTop(); renderHoy(); renderPos(); renderRes(); renderNews(); }

function renderTop(){
  const s = D.spy_last || {}, pill = $("pill");
  pill.className = "pill " + (live() ? "on" : QERR ? "off" : "");
  pill.lastElementChild.textContent = live() ? "En vivo " + QAT.toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"}) : QERR || ("Cierre " + dd(s.d));
  const idx = ["SPY","QQQ","IWM"].map(k=>{ const q = Q[k]; return live() && q ? `<span><b>${k}</b>${px(q.last)} <span class="${cls(q.chg)}">${pct(q.chg)}</span></span>` : ""; }).join("");
  $("strip").innerHTML = idx || `<span><b>SPY</b>${px(s.c)} <span class="mut">cierre ${day(s.d)}</span></span><span class="mut">${D.run ? (D.run.status==="ok" ? "rutina ok" : "rutina con error") : ""}</span>`;
  const c = cum(D.swing_res||[], "ret", "spy_cc"), rs = (D.open||[]).map(ret).filter(x=>x!=null), avg = mean(rs);
  $("kpis").innerHTML = [
    ["Swing real", c.n ? pct(c.m,1) : "—", cls(c.m)], ["SPY", c.n ? pct(c.s,1) : "—", cls(c.s)],
    ["Abiertas", String(rs.length), ""], ["Van", pct(avg), cls(avg)]
  ].map(([k,v,cl])=>`<div class="kpi"><div class="k">${k}</div><div class="v ${cl}">${v}</div></div>`).join("");
}

function renderHoy(){
  const sw = D.swing || {}, picks = sw.picks || [];
  const head = live() ? `<tr><th class="rank">#</th><th class="l">Símbolo</th><th>Abrió</th><th>Límite</th><th>Ahora</th><th>Va</th></tr>`
                      : `<tr><th class="rank">#</th><th class="l">Símbolo</th><th>Cierre</th><th>Límite</th><th>Acc.</th></tr>`;
  const rows = picks.map(p=>{
    const q = Q[p.symbol];
    if (live() && q && q.open){
      const over = q.open > p.max_entry, r = q.last/q.open - 1;
      return `<tr class="${over?"off":""}"><td class="rank">${p.rank}</td><td class="l"><span class="sym">${esc(p.symbol)}</span>${over?'<span class="chip neg">no comprar</span>':""}</td><td>${px(q.open)}</td><td class="mut">${px(p.max_entry)}</td><td>${px(q.last)}</td><td class="${over?"mut":cls(r)}">${over?"—":pct(r)}</td></tr>`;
    }
    return `<tr><td class="rank">${p.rank}</td><td class="l"><span class="sym">${esc(p.symbol)}</span>${p.sp500?"":'<span class="chip">mkt</span>'}<span class="sub2">${esc(p.name||"")}</span></td><td>${px(p.close)}</td><td class="amb">${px(p.max_entry)}</td><td>${qty(p.shares, p.close)}</td></tr>`;
  }).join("");
  let h = panel("Comprar en la apertura", `señal ${dd(sw.signal_date)} · venta ${dd(picks[0] && picks[0].sell_session)}`,
    picks.length ? `<div class="scroll"><table><thead>${head}</thead><tbody>${rows}</tbody></table></div>
      <p class="note">${money(PER)} por acción (1/5 del capital entre 10); acciones fraccionarias si no alcanza. Si abre arriba del <span class="amb">límite</span>, no se compra. «mkt» = fuera del S&amp;P 500.</p>`
      : `<p class="empty">Todavía no hay lista.</p>`);
  const ns = nextSell(), sells = (D.open||[]).filter(p => p.sell_session === ns && bought(p));
  if (sells.length) h += panel("Vender al cierre", day(ns),
    `<table><thead><tr><th class="l">Símbolo</th><th>Entrada</th><th>${live()?"Ahora":"Cierre"}</th><th>Va</th></tr></thead><tbody>`
    + sells.map(p=>`<tr><td class="l"><span class="sym">${esc(p.symbol)}</span></td><td>${px(p.entry)}</td><td>${px(nowPx(p))}</td><td class="${cls(ret(p))}">${pct(ret(p))}</td></tr>`).join("") + `</tbody></table>`);
  const al = (D.alerts||[]).slice(0,6);
  if (al.length) h += panel("Alertas", "últimas", `<table><tbody>${al.map(a=>`<tr><td class="l"><span class="sym">${esc(a.symbol)}</span></td><td class="l mut">${esc(KIND[a.kind]||a.kind)}</td><td class="mut">${dd(a.day)}</td></tr>`).join("")}</tbody></table>`);
  $("t-hoy").innerHTML = h;
}
const KIND = {no_buy:"abrió arriba del límite", drop:"cayó más de 2 ATR", sell:"vender al cierre"};

function renderPos(){
  const op = D.open || [];
  if (!op.length){ $("t-pos").innerHTML = panel("Posiciones abiertas", "", `<p class="empty">No hay listas abiertas.</p>`); return; }
  const by = {}; op.forEach(p => (by[p.signal_date] = by[p.signal_date] || []).push(p));
  let body = "", summary = "";
  Object.keys(by).sort().reverse().forEach(sig=>{
    const ps = by[sig], avg = mean(ps.map(ret).filter(x=>x!=null));
    summary += `<tr><td class="l">${dd(sig)}</td><td class="l mut">${dd(ps[0].entry_d)}</td><td>${ps.filter(bought).length}</td><td class="${cls(avg)}">${pct(avg)}</td><td class="l">${dd(ps[0].sell_session)}</td></tr>`;
    body += `<tr class="grp"><td colspan="5">Señal ${day(sig)} · venta ${day(ps[0].sell_session)}</td></tr>`
      + ps.map(p=>{ const skip = p.entry && !bought(p), r = ret(p);
          return `<tr class="${skip?"off":""}"><td class="l"><span class="sym">${esc(p.symbol)}</span>${skip?'<span class="chip neg">no comprada</span>':""}</td><td>${px(p.entry)}</td><td>${px(nowPx(p))}</td><td class="${skip?"mut":cls(r)}">${skip?"—":pct(r)}</td><td>${skip?"—":qty(p.shares, p.entry)}</td></tr>`; }).join("");
  });
  $("t-pos").innerHTML =
    panel("Listas abiertas", live() ? "en vivo" : "al último cierre",
      `<div class="scroll"><table><thead><tr><th class="l">Señal</th><th class="l">Compra</th><th>Acc.</th><th>Va</th><th class="l">Venta</th></tr></thead><tbody>${summary}</tbody></table></div>`)
  + panel("Detalle por acción", "", `<div class="scroll"><table><thead><tr><th class="l">Símbolo</th><th>Entrada</th><th>${live()?"Ahora":"Cierre"}</th><th>Va</th><th>Acc.</th></tr></thead><tbody>${body}</tbody></table></div>
      <p class="note">Entrada = apertura del día de compra. Con el mercado abierto el precio se actualiza cada 15 s (bolsa IEX); fuera de horario es el último cierre.</p>`);
}

function renderRes(){
  const r = D.swing_res || [], d1 = (D.day1 && D.day1.res) || [], c = cum(r, "ret", "spy_cc"), c1 = cum(d1, "model_ret", "spy_oc");
  const stat = (k,v,cl) => `<div class="kpi"><div class="k">${k}</div><div class="v ${cl||""}">${v}</div></div>`;
  $("t-res").innerHTML =
    panel("Swing 5 días · real", `${c.n} sesiones`,
      `<div class="kpis" style="margin:6px 0 8px">${stat("Swing", c.n?pct(c.m,1):"—", cls(c.m))}${stat("SPY", c.n?pct(c.s,1):"—", cls(c.s))}${stat("Diferencia", c.n?pct(c.m-c.s,1):"—", cls(c.m-c.s))}${stat("Le ganó", c.n?`${c.w}/${c.n}`:"—")}</div>
       <table><thead><tr><th class="l">Sesión</th><th>Swing</th><th>SPY</th><th>Dif.</th><th>Grupos</th></tr></thead><tbody>`
      + (r.map(x=>`<tr><td class="l">${day(x.session)}</td><td class="${cls(x.ret)}">${pct(x.ret)}</td><td class="${cls(x.spy_cc)}">${pct(x.spy_cc)}</td><td class="${cls(x.ret-x.spy_cc)}">${pct(x.ret-x.spy_cc)}</td><td class="mut">${x.cohorts??"—"}</td></tr>`).join("") || `<tr><td colspan="5" class="empty">Sin sesiones calificadas.</td></tr>`)
      + `</tbody></table>`)
  + panel("Modelo 1 día · comparación", `${c1.n} sesiones`,
      `<p class="note" style="margin:4px 0 6px">Acumulado: modelo <span class="${cls(c1.m)}">${pct(c1.m,1)}</span> vs SPY <span class="${cls(c1.s)}">${pct(c1.s,1)}</span> (apertura a cierre).</p>
       <table><thead><tr><th class="l">Sesión</th><th>Modelo</th><th>SPY</th><th>En top</th><th>Stops</th></tr></thead><tbody>`
      + d1.map(x=>`<tr><td class="l">${day(x.session)}</td><td class="${cls(x.model_ret)}">${pct(x.model_ret)}</td><td class="${cls(x.spy_oc)}">${pct(x.spy_oc)}</td><td>${x.hits??"—"}</td><td class="mut">${x.stops??"—"}</td></tr>`).join("") + `</tbody></table>`);
}

function renderNews(){
  const N = D.news || {}, d = N.day;
  if (!d){ $("t-news").innerHTML = panel("Noticias", "", `<p class="empty">Todavía no hay noticias guardadas.</p>`); return; }
  const hd = d.headlines || {}, rc = hd.react || {};
  const stat = (k,v,cl) => `<div class="kpi"><div class="k">${k}</div><div class="v ${cl||""}">${v}</div></div>`;
  let h = panel("Noticias del día", `${day(d.d)} · ${Number(d.n||0).toLocaleString("en-US")} titulares`,
    `<div class="kpis" style="margin:6px 0 4px">${stat("SPY", pct(d.spy_ret), cls(d.spy_ret))}${stat("Tono", (d.tone>=0?"+":"")+(+d.tone||0).toFixed(2), cls(d.tone))}${stat("Noticia +", pct(rc.pos,1), cls(rc.pos))}${stat("Noticia −", pct(rc.neg,1), cls(rc.neg))}</div>
     <p class="note" style="margin-top:4px">«Noticia + / −»: mediana del día de las acciones con titulares positivos o negativos.</p>`);
  if ((hd.macro||[]).length) h += panel("Macro", "", `<div class="list">${hd.macro.map(x=>`<div>${esc(x)}</div>`).join("")}</div>`);
  if ((hd.movers||[]).length) h += panel("Lo que movió acciones", "", `<table><tbody>${hd.movers.map(m=>`<tr><td class="l"><span class="sym">${esc(m.s)}</span></td><td class="${cls(m.ret)}">${pct(m.ret,1)}</td></tr><tr><td colspan="2" class="wrap">${esc(m.h)}</td></tr>`).join("")}</tbody></table>`);
  const hist = N.hist || [], rec = hist.filter(x=>x.k<=5), pri = hist.filter(x=>x.k>5);
  const tot = (xs)=>xs.reduce((a,x)=>a+(x.n||0),0), nr = tot(rec), np = tot(pri);
  const sum = (xs,t)=>xs.reduce((a,x)=>a+((x.themes||{})[t]||0),0);
  const th = Object.keys(d.themes||{}).map(t=>{ const r=sum(rec,t), sr=nr?r/nr:0, sp=np?sum(pri,t)/np:0; return {t, r, ratio:(sr+1e-4)/(sp+1e-4)}; })
    .filter(x=>x.r>=5).sort((a,b)=>b.ratio-a.ratio).slice(0,8);
  const mx = Math.max(2, ...th.map(x=>x.ratio));
  if (th.length && np) h += panel("Temas en aumento", `5 sesiones vs ${pri.length}`, th.map(x=>`<div class="thb"><span>${esc(x.t)}</span><div class="bar"><i class="${x.ratio<1.3?"cool":""}" style="width:${Math.min(100,x.ratio/mx*100).toFixed(0)}%"></i></div><span class="${x.ratio>=1.3?"amb":"mut"}" style="text-align:right">×${x.ratio.toFixed(1)}</span></div>`).join(""));
  const mine = new Set(((D.swing||{}).picks||[]).map(p=>p.symbol));
  if ((N.att||[]).length) h += panel("Atención inusual", "notas 5 días vs normal",
    `<table><thead><tr><th class="l">Símbolo</th><th>Notas</th><th>× normal</th><th>Tono</th></tr></thead><tbody>${N.att.map(a=>`<tr><td class="l"><span class="sym">${esc(a.s)}</span>${mine.has(a.s)?'<span class="chip pos">en lista</span>':""}</td><td>${a.n5}</td><td class="amb">×${(+a.x).toFixed(0)}</td><td class="${cls(a.tone)}">${(a.tone>=0?"+":"")+(+a.tone).toFixed(2)}</td></tr>`).join("")}</tbody></table>
     <p class="note">Las noticias son contexto: la prueba de 3 años mostró que no mejoran las predicciones del swing.</p>`);
  $("t-news").innerHTML = h;
}

/* ---------- acceso ---------- */
async function auth(kind){
  const email = $("em").value.trim(), password = $("pw").value;
  $("aerr").style.color = ""; $("aerr").textContent = "";
  if (!email || password.length < 8){ $("aerr").textContent = "Escribe tu correo y una contraseña de al menos 8 caracteres."; return; }
  const r = kind==="in" ? await sb.auth.signInWithPassword({email, password})
                        : await sb.auth.signUp({email, password, options:{emailRedirectTo: location.origin + location.pathname}});
  if (r.error){ $("aerr").textContent = /confirm/i.test(r.error.message) ? "Confirma tu correo primero (revisa tu bandeja y spam)." : /Invalid login/i.test(r.error.message) ? "Correo o contraseña incorrectos." : r.error.message; return; }
  if (kind==="up" && !r.data.session){ $("aerr").style.color="var(--up)"; $("aerr").textContent = "Listo. Te mandé un correo: toca el enlace para confirmar y luego regresa aquí a Entrar."; return; }
  start();
}
$("bIn").onclick = () => auth("in"); $("bUp").onclick = () => auth("up");
$("pw").addEventListener("keydown", e => { if (e.key==="Enter") auth("in"); });
$("bRef").onclick = () => load().then(quotes);
$("bOut").onclick = async () => { clearInterval(qTimer); await sb.auth.signOut(); try{ localStorage.removeItem("qx_cache"); }catch(e){} show("auth"); };

async function start(){
  show("app");
  let t = "hoy"; try{ t = localStorage.getItem("qx_tab") || "hoy"; }catch(e){}
  tab(t);
  try{ const c = JSON.parse(localStorage.getItem("qx_cache")||"null"); if (c){ D = c; render(); } }catch(e){}
  await load();
  liveLoop();
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && !$("app").hidden) load().then(quotes); });

(async () => {
  const {data} = await sb.auth.getSession();
  data.session ? start() : show("auth");
})();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
