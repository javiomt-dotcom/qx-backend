name: QX noticias (investigación)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe = probar fuentes"
        default: "probe"

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python news_research.py ${{ inputs.mode || 'probe' }} | tee news.md
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID || secrets.ALPACA_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY || secrets.ALPACA_SECRETO }}
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY || secrets.ALPHA_VANTAGE_KEY }}
      - run: cat news.md >> "$GITHUB_STEP_SUMMARY"
