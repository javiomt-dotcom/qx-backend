name: QX alertas

on:
  schedule:
    # GitHub retrasa o se salta muchas corridas programadas; por eso hay tres arranques al día y cada uno
    # se queda revisando cada 15 minutos durante 160 minutos (cubre 13:20 a ~21:20 UTC, horario de verano e invierno).
    # Si un arranque se atrasa, el siguiente espera en fila y empieza cuando termina el anterior.
    - cron: "20 13 * * 1-5"
    - cron: "50 15 * * 1-5"
    - cron: "20 18 * * 1-5"
  workflow_dispatch:

concurrency:
  group: qx-alertas
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python intraday.py --loop 160 --every 15
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID || secrets.ALPACA_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY || secrets.ALPACA_SECRETO }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.BOT }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
