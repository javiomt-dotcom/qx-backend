name: QX investigación

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Años de historia"
        default: "3"
      script:
        description: "Prueba a correr"
        type: choice
        default: research.py
        options:
          - research.py
          - research_bias.py
          - research_portfolios.py
          - research_profiles.py
          - research_buffett.py
          - research_growth.py

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: set -o pipefail; python ${{ inputs.script || 'research.py' }} --years ${{ inputs.years || '3' }} | tee research.md
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID || secrets.ALPACA_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY || secrets.ALPACA_SECRETO }}
      - run: grep -v '^\[' research.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research
          path: |
            research.md
            research_portfolios.json
          if-no-files-found: ignore
